apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The Namespace is intentionally NOT in the base: DiSP pre-creates the tenant
# namespace, while local/aws overlays add ../namespace (00-namespace.yaml) themselves.
resources:
  - 01-config.yaml
  - 10-db.yaml
  - 20-fhir.yaml
  - 30-referrer.yaml
  - 40-seed-job.yaml
  - 50-ingress.yaml
