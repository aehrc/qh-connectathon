# Seed Job — creates the second logical database (hapi_dir) used by the directory
# server. Both HAPI servers share one Postgres instance; the `hapi` database is created
# by the Postgres image from POSTGRES_DB, but the directory server needs its own
# `hapi_dir` database, which we create here idempotently.
#
# IG loading is NO LONGER done here. The HCPD IG is installed natively by HAPI on boot
# via hapi.fhir.implementationguides.*.packageUrl (see 20-fhir.yaml) — the CI-build
# tarball is fetched and installed automatically when the directory pod starts. This
# matches the akkadakka / aehrc-quokka-deploy pattern and removes the need for a
# tarball-PUT loop. (validate_resource_status_for_package_upload=false handles the
# draft-resource drop, akkadakka "Bug 8".)
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: track2
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: createdb
          image: postgres:16-alpine   # provides psql/createdb
          env:
            - { name: PGHOST, value: db }
            - { name: PGPORT, value: "5432" }
            - { name: PGUSER, valueFrom: { secretKeyRef: { name: db-secret, key: POSTGRES_USER } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: db-secret, key: POSTGRES_PASSWORD } } }
          command: ["/bin/sh","-c"]
          args:
            - |
              set -e
              echo "Waiting for Postgres at $PGHOST:$PGPORT..."
              until pg_isready -q; do sleep 3; done
              # Create hapi_dir if it does not already exist (idempotent).
              if psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='hapi_dir'" | grep -q 1; then
                echo "Database hapi_dir already exists."
              else
                echo "Creating database hapi_dir..."
                createdb hapi_dir
                echo "Created hapi_dir."
              fi
              echo "Seed complete."
