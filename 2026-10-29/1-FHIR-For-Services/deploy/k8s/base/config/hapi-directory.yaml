# HAPI config for the DIRECTORY server — installs the HCPD IG natively on boot.
# Mounted at /data/hapi/application.yaml via spring.config.additional-location.
# Uses packageUrl (the FHIR CI-build tarball) because HCPD is NOT on a package
# registry; installMode STORE_AND_INSTALL imports the conformance resources.
# validate_resource_status_for_package_upload=false avoids akkadakka "Bug 8"
# (HAPI silently dropping non-active CodeSystem/ValueSet during package upload).
hapi:
  fhir:
    fhir_version: R4
    validate_resource_status_for_package_upload: false
    # Remote terminology (the one external dependency) — map form per HAPI.
    remote_terminology_service:
      tx:
        url: ${TX_URL:https://tx.ontoserver.csiro.au/fhir}
    implementationguides:
      hcpd:
        name: au.gov.digitalhealth.fhir.hcpd
        version: 26.0.0
        packageUrl: https://build.fhir.org/ig/AuDigitalHealth/HCPD/package.tgz
        installMode: STORE_AND_INSTALL
        reloadExisting: false
        fetchDependencies: false     # deps (au.base/au.core/au.pd) not needed just to hold directory resources
    logical_urls:
      - http://digitalhealth.gov.au/fhir/hcpd/*
