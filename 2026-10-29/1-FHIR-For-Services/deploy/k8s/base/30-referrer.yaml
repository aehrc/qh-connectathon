# Patient-Referral (mjosborne1) — the Referrer/Filler UI, browser-core path.
# Image is built on the VM and imported into microk8s (see k8s-install.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: referrer
  namespace: track2
spec:
  replicas: 1
  selector: { matchLabels: { app: referrer } }
  template:
    metadata: { labels: { app: referrer } }
    spec:
      containers:
        - name: referrer
          image: localhost:32000/patient-referral:local
          imagePullPolicy: IfNotPresent      # image imported locally, not pulled
          env:
            # Setting PORT triggers the app's cloud-host branch: bind 0.0.0.0:$PORT
            # (containerd does not create /.dockerenv, so the app would otherwise fall
            # back to 127.0.0.1:5001 and be unreachable from the Service).
            - { name: PORT,       value: "5000" }
            - { name: USE_AUTH,   value: "false" }
            - { name: FHIR_SERVER, value: "http://fhir:8080/fhir" }
            - { name: PD_SERVER,   value: "http://directory:8080/fhir" }
          ports: [ { containerPort: 5000 } ]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: referrer, namespace: track2 }
spec:
  selector: { app: referrer }
  ports: [ { port: 5000, targetPort: 5000 } ]
