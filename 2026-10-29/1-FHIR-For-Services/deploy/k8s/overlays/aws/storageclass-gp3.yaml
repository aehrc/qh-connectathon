# gp3 StorageClass for EKS (EBS CSI driver). gp3 is cheaper/faster than the gp2 default.
# Requires the aws-ebs-csi-driver addon on the cluster.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  fsType: ext4
