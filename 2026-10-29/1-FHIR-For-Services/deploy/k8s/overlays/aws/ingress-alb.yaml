# Ingress for EKS Auto Mode — references the Auto Mode IngressClass.
# No alb.ingress.kubernetes.io annotations here: scheme/cert/group live in
# IngressClassParams (ingressclass-automode.yaml). Per-Ingress annotations are
# only for behaviours not covered there (e.g. healthcheck path).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: track2
  namespace: track2
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /fhir/metadata
spec:
  ingressClassName: track2-alb
  rules:
    # TODO: set the real Track 2 host (CA/ACM DNS name, infra issue #13)
    - host: track2.REPLACE-ME.example
      http:
        paths:
          - path: /fhir
            pathType: Prefix
            backend: { service: { name: fhir, port: { number: 8080 } } }
          - path: /directory
            pathType: Prefix
            backend: { service: { name: directory, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: referrer, port: { number: 5000 } } }
