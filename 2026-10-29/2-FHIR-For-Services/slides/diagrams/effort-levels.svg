<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" preserveAspectRatio="xMidYMid meet" version="1.1" viewBox="0 0 957 272" zoomAndPan="magnify"><defs/><g><!--entity K1--><g class="entity" data-qualified-name="K1" data-source-line="5" id="ent0002"><rect fill="#E6F6FA" height="229.7487" rx="5" ry="5" style="stroke:#00A9CE;stroke-width:0.5;" width="279.6229" x="7" y="22"/><text fill="#001D34" font-family="Calibri" font-size="22" font-weight="bold" x="17" y="55.5181">1  Configure</text><text fill="#001D34" font-family="Calibri" font-size="22" x="17" y="85.4822">&#160;</text><text fill="#001D34" font-family="Calibri" font-size="22" x="17" y="115.4463">A stock server</text><text fill="#001D34" font-family="Calibri" font-size="22" x="17" y="145.4104">and settings</text><text fill="#001D34" font-family="Calibri" font-size="22" x="17" y="175.3745">&#160;</text><text fill="#001D34" font-family="Calibri" font-size="22" text-decoration="underline" x="17" y="205.3386">e.g.</text><text fill="#001D34" font-family="Calibri" font-size="22" x="60.4501" y="205.3386">HAPI FHIR set up</text><text fill="#001D34" font-family="Calibri" font-size="22" x="17" y="235.3027">from akkadakka snippets</text></g><!--entity K2--><g class="entity" data-qualified-name="K2" data-source-line="6" id="ent0003"><rect fill="#8AD8EA" height="259.7128" rx="5" ry="5" style="stroke:#00A9CE;stroke-width:0.5;" width="293.3729" x="322.5" y="7"/><text fill="#001D34" font-family="Calibri" font-size="22" font-weight="bold" x="332.5" y="40.5181">2  Add an IG</text><text fill="#001D34" font-family="Calibri" font-size="22" x="332.5" y="70.4822">&#160;</text><text fill="#001D34" font-family="Calibri" font-size="22" x="332.5" y="100.4463">Profiles, ValueSets,</text><text fill="#001D34" font-family="Calibri" font-size="22" x="332.5" y="130.4104">CapabilityStatement.</text><text fill="#001D34" font-family="Calibri" font-size="22" x="332.5" y="160.3745">No code.</text><text fill="#001D34" font-family="Calibri" font-size="22" x="332.5" y="190.3386">&#160;</text><text fill="#001D34" font-family="Calibri" font-size="22" text-decoration="underline" x="332.5" y="220.3027">e.g.</text><text fill="#001D34" font-family="Calibri" font-size="22" x="375.9501" y="220.3027">the Radiology Referral</text><text fill="#001D34" font-family="Calibri" font-size="22" x="332.5" y="250.2668">and Booking IG</text></g><!--entity K3--><g class="entity" data-qualified-name="K3" data-source-line="7" id="ent0004"><rect fill="#007A9A" height="229.7487" rx="5" ry="5" style="stroke:#00A9CE;stroke-width:0.5;" width="301.1829" x="650.5" y="22"/><text fill="#FFFFFF" font-family="Calibri" font-size="22" font-weight="bold" x="660.5" y="55.5181">3  Write code</text><text fill="#001D34" font-family="Calibri" font-size="22" x="660.5" y="85.4822">&#160;</text><text fill="#FFFFFF" font-family="Calibri" font-size="22" x="660.5" y="115.4463">Only where there is</text><text fill="#FFFFFF" font-family="Calibri" font-size="22" x="660.5" y="145.4104">no standard shape</text><text fill="#001D34" font-family="Calibri" font-size="22" x="660.5" y="175.3745">&#160;</text><text fill="#FFFFFF" font-family="Calibri" font-size="22" text-decoration="underline" x="660.5" y="205.3386">e.g.</text><text fill="#FFFFFF" font-family="Calibri" font-size="22" x="703.9501" y="205.3386">the HL7 v2 adapter:</text><text fill="#FFFFFF" font-family="Calibri" font-size="22" x="660.5" y="235.3027">about 155 + 68 lines of Java</text></g><!--link K1 to K2--><!--link K2 to K3--><?plantuml-src TL9XQnD14Fr-l-9P1U5iJtAXAg4MOgKcjTIIW7xm94nkvoxBRNQFtRs4-EixTq4qIByCmxwPUM_Ux6jyvafR3eWR1bULyn6bCwxpyBHjqGLMM1y6s4dm2EntkfGEfQcMcZ218jy8yX5Rvnbb5wBROkzyaoKlj2rDfnWj6OwHCzrjJH8QRLkIPYYkg3FnrjcurByPUPuadij8jZQCipGT0JVELhhkFATfOGixXSmlcq48-yAILPB7g6qTUdorugpELYlCfezptCxcYnv6rnQsyYACcePK7n2iRbkEuGmKy7M4bw_kHwViEJ1L2cGn_t9aV_IkqeR3ERwJwNWfxUU5lQ6MrjheU5X6Yhnb6xF2FZZnKd