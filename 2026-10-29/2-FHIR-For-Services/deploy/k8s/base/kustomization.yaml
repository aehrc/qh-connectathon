apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The Namespace is intentionally NOT in the base: DiSP pre-creates the tenant
# namespace, while local/aws overlays add ../namespace (00-namespace.yaml) themselves.
resources:
  - 01-config.yaml
  - 10-db.yaml
  - 20-fhir.yaml
  - 30-referrer.yaml
  - 35-banner.yaml
  - 60-frog.yaml
  - 40-seed-job.yaml
  - 50-ingress.yaml

# Third-party images pinned by digest (verified to resolve anonymously, 2026-10-20). The HAPI image is pinned in 20-fhir.yaml and
# frog-runner in 60-frog.yaml; the Patient-Referral UI image is pinned in each overlay's images: block.
images:
  - name: postgres
    digest: sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5          # postgres:16
  - name: nginxinc/nginx-unprivileged
    digest: sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0          # 1.27-alpine
  - name: alpine
    digest: sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc          # 3.20
