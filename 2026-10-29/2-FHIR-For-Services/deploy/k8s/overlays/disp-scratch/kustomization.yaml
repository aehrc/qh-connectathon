# Scratch copy of the DiSP stack, side by side with the live one in the same tenant namespace
# (tenants cannot create namespaces). Own Postgres + PVC, own hostname (qh-fhir-test.dw.csiro.au; *.dw.csiro.au is a wildcard so any free name works). Delete with:
#   kustomize build overlays/disp-scratch | kubectl delete -f -
# Used to test a fresh-database boot (full pinned IG set, /directory/fhir, seeds, smoke.sh) before
# touching the live deployment. NOT the event host.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aehrc-qh-connectathon-track-2
namePrefix: scratch-
resources:
  - ../disp
labels:
  - pairs: { track2-instance: scratch }
    includeSelectors: true
patches:
  # ISOLATION: the live Services select on app=<name> only, so scratch pods that also carried app=<name> were added to the LIVE
  # Services' endpoints (traffic and database connections were split across both stacks). Give every scratch pod, and its
  # Service selector, a distinct app label.
  - patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: scratch-db
      - op: replace
        path: /spec/template/metadata/labels/app
        value: scratch-db
    target: { kind: Deployment, name: db }
  - patch: |-
      - op: replace
        path: /spec/selector/app
        value: scratch-db
    target: { kind: Service, name: db }
  - patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: scratch-fhir
      - op: replace
        path: /spec/template/metadata/labels/app
        value: scratch-fhir
    target: { kind: Deployment, name: fhir }
  - patch: |-
      - op: replace
        path: /spec/selector/app
        value: scratch-fhir
    target: { kind: Service, name: fhir }
  - patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: scratch-directory
      - op: replace
        path: /spec/template/metadata/labels/app
        value: scratch-directory
    target: { kind: Deployment, name: directory }
  - patch: |-
      - op: replace
        path: /spec/selector/app
        value: scratch-directory
    target: { kind: Service, name: directory }
  - patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: scratch-referrer
      - op: replace
        path: /spec/template/metadata/labels/app
        value: scratch-referrer
    target: { kind: Deployment, name: referrer }
  - patch: |-
      - op: replace
        path: /spec/selector/app
        value: scratch-referrer
    target: { kind: Service, name: referrer }
  - patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: scratch-banner
      - op: replace
        path: /spec/template/metadata/labels/app
        value: scratch-banner
    target: { kind: Deployment, name: banner }
  - patch: |-
      - op: replace
        path: /spec/selector/app
        value: scratch-banner
    target: { kind: Service, name: banner }
  - patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: scratch-frog
      - op: replace
        path: /spec/template/metadata/labels/app
        value: scratch-frog
    target: { kind: Deployment, name: frog }
  - patch: |-
      - op: replace
        path: /spec/selector/app
        value: scratch-frog
    target: { kind: Service, name: frog }
  # frog-runner on the scratch stack is OFF by default: the namespace sits at its limits.cpu cap with two stacks plus RIS, and
  # cert-manager's ACME solver pods then cannot start (certificates stay pending). Set replicas to 1 to test it here.
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
    target: { kind: Deployment, name: frog }
  # frog-runner gets its own host here too (hosts must be unique per cluster)
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: qh-fhir-test-frog.dw.csiro.au
      - op: replace
        path: /spec/tls/0/hosts/0
        value: qh-fhir-test-frog.dw.csiro.au
      - op: replace
        path: /spec/tls/0/secretName
        value: qh-fhir-test-frog-tls
    target: { kind: Ingress, name: frog }
  # Quota is tight (limits.cpu), so never surge: replace a pod in place (brief downtime per rollout)
  # instead of starting the new pod beside the old one, which fails with "exceeded quota".
  - patch: |-
      - op: add
        path: /spec/strategy
        value: { type: RollingUpdate, rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
    target: { kind: Deployment }
  # in-cluster hostnames are hard-coded in the base; kustomize only prefixes object names
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: fhir, namespace: aehrc-qh-connectathon-track-2 }
      spec: { template: { spec: { containers: [ { name: hapi, env: [
        { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://scratch-db:5432/hapi" },
        { name: HAPI_FHIR_SERVER_ADDRESS, value: "https://qh-fhir-test.dw.csiro.au/referral/fhir" } ] } ] } } }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: directory, namespace: aehrc-qh-connectathon-track-2 }
      spec: { template: { spec: { containers: [ { name: hapi, env: [
        { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://scratch-db:5432/hapi_dir" },
        { name: HAPI_FHIR_SERVER_ADDRESS, value: "https://qh-fhir-test.dw.csiro.au/directory/fhir" } ] } ] } } }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: referrer, namespace: aehrc-qh-connectathon-track-2 }
      spec: { template: { spec: { containers: [ { name: referrer, env: [
        { name: FHIR_SERVER_URL, value: "http://scratch-fhir:8080/referral/fhir" },
        { name: FHIR_SERVER, value: "http://scratch-fhir:8080/referral/fhir" },
        { name: PD_SERVER, value: "http://scratch-directory:8080/directory/fhir" } ] } ] } } }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: banner, namespace: aehrc-qh-connectathon-track-2 }
      spec: { template: { spec: { containers: [ { name: nginx, env: [
        { name: UPSTREAM, value: "http://scratch-referrer:5000" } ] } ] } } }
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata: { name: seed, namespace: aehrc-qh-connectathon-track-2 }
      spec: { template: { spec: { containers: [ { name: createdb, env: [ { name: PGHOST, value: scratch-db } ] } ] } } }
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: qh-fhir-test.dw.csiro.au
      - op: replace
        path: /spec/tls/0/hosts/0
        value: qh-fhir-test.dw.csiro.au
      - op: replace
        path: /spec/tls/0/secretName
        value: qh-fhir-test-tls
    target: { kind: Ingress, name: track2 }
