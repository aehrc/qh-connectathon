# gp3 StorageClass for EKS Auto Mode.
# Auto Mode does NOT create a StorageClass and uses its OWN provisioner
# (ebs.csi.eks.amazonaws.com), not the self-managed EBS CSI (ebs.csi.aws.com).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
